{%- comment -%}
  Screenshot or GIF with a caption.
  Usage: {% include figure.html src="/assets/images/getting-started/first-service/01-new-service.png" alt="The new service form" caption="Optional caption" %}
  `alt` is required. `width` (px) is optional and caps the display width.
{%- endcomment -%}
<figure class="help-figure">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy"{% if include.width %} style="max-width: {{ include.width }}px"{% endif %}>
  {%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif -%}
</figure>
